<html lang="ko">

    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            font-family: 'Noto Sans KR', sans-serif;
        }
        #lobby {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: #2d2d2d;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            width: 320px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            text-align: center;
            border-radius: 6px;
            border: 2px solid #4d94ff;
            outline: none;
            width: 80%;
            background-color: #1a1a1a;
            color: white;
        }
        button {
            padding: 12px 24px;
            font-size: 18px;
            background-color: #4d94ff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 90%;
            transition: 0.2s;
        }
        button:hover {
            background-color: #3377e6;
        }
        #leaderboard-box {
            margin-top: 10px;
            width: 100%;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }
        #leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 5px 0 0 0;
            max-height: 150px;
            overflow-y: auto;
        }
        #leaderboard-list li {
            display: flex;
            justify-content: space-between;
            padding: 4px 8px;
            border-bottom: 1px solid #333;
        }
        #game-container {
            display: none;
            position: relative;
        }

        /* 퀴즈 공격 모달 창 스타일 */
        #quiz-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            background: #22223b;
            border: 3px solid #ff4d4d;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.6);
            text-align: center;
            z-index: 100;
        }
        #quiz-modal h3 {
            margin: 0 0 10px 0;
            color: #ff4d4d;
            font-size: 20px;
        }
        #quiz-question {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #ffffff;
        }
        .quiz-option-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            font-size: 16px;
            background-color: #4a4e69;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .quiz-option-btn:hover {
            background-color: #9a8c98;
        }
    </style>
</head>
<body>

    <!-- 방 접속 및 랭킹 로비 화면 -->
    <div id="lobby">
        <h2 style="margin: 0;">🎮 퀴즈 공격 퍼즐 대전</h2>
        <p style="font-size: 13px; color: #aaa; margin: 0;">2x2를 터뜨려 상대 점수를 깎으세요!</p>
        <input type="text" id="nicknameInput" placeholder="닉네임 입력 (예: 학생1)" maxlength="8">
        <button onclick="startMatchmaking()">⚡ 대결 시작하기</button>

        <!-- 실시간 누적 랭킹 목록 -->
        <div id="leaderboard-box">
            <div style="font-weight: bold; color: #ffd633; text-align: center;">🏆 실시간 누적 랭킹 (Top 10)</div>
            <ul id="leaderboard-list">
                <li style="color: #888;">로딩 중...</li>
            </ul>
        </div>
    </div>

    <!-- 게임 화면 및 퀴즈 모달 -->
    <div id="game-container">
        <div id="quiz-modal">
            <h3>⚡ 2x2 퀴즈 공격 발동!</h3>
            <p style="font-size:12px; color:#ffd633; margin-top:-5px;">정답 시 상대방 점수 -300점 차감!</p>
            <div id="quiz-question">문제 로딩중...</div>
            <div id="quiz-options"></div>
        </div>
    </div>

            { q: "7 × 8 은 얼마일까요?", options: ["54", "56", "64", "48"], a: 1 },
            { q: "5 × 6 은 얼마일까요?", options: ["54", "56", "64", "48"], a: 1 },
            { q: "우리나라의 수도는 어디일까요?", options: ["부산", "인천", "서울", "제주"], a: 2 },
            { q: "1분은 몇 초일까요?", options: ["30초", "50초", "60초", "100초"], a: 2 },
            { q: "12 + 29 의 값은?", options: ["41", "39", "42", "31"], a: 0 },
            { q: "임진왜란 때 한산도 대첩을 이끈 장군은?", options: ["강감찬", "이순신", "김유신", "을지문덕"], a: 1 },
            { q: "삼각형의 내각의 합은 몇 도일까요?", options: ["90도", "180도", "270도", "360도"], a: 1 },
            { q: "9 × 9 는 얼마일까요?", options: ["72", "81", "90", "89"], a: 1 },
            { q: "다음 중 태양계에서 가장 큰 행성은?", options: ["지구", "화성", "목성", "토성"], a: 2 },
            { q: "150 - 60 의 값은?", options: ["80", "90", "100", "70"], a: 1 },
            { q: "한글을 창제하신 조선의 왕은?", options: ["태종", "세종대왕", "정조", "영조"], a: 1 }
        ];

        // Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyDL88cc1AvcAUW0_f8y7fQHkI2bqPB0028",
            authDomain: "puzzle-siry.firebaseapp.com",
            databaseURL: "https://puzzle-siry-default-rtdb.firebaseio.com",
            projectId: "puzzle-siry",
            storageBucket: "puzzle-siry.firebasestorage.app",
            messagingSenderId: "786436907175",
            appId: "1:786436907175:web:6a207f29b484ad6119fb82"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let myNickname = "";
        let opponentNickname = "상대방";
        let roomId = "";
        let playerRole = ""; // 'p1' 또는 'p2'
        let roomRef = null;
        let gameScene = null;

        // --- 1. 실시간 누적 리더보드 로드 ---
        function loadLeaderboard() {
            database.ref('leaderboard').orderByChild('wins').limitToLast(10).on('value', (snapshot) => {
                const listEl = document.getElementById('leaderboard-list');
                listEl.innerHTML = '';

                const users = [];
                snapshot.forEach(child => {
                    users.push(child.val());
                });
                users.reverse();

                if (users.length === 0) {
                    listEl.innerHTML = '<li style="text-align:center; color:#888;">기록이 없습니다.</li>';
                    return;
                }

                users.forEach((u, idx) => {
                    const rankBadge = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `${idx + 1}.`;
                    const li = document.createElement('li');
                    li.innerHTML = `<span>${rankBadge} <b>${u.nickname}</b></span> <span>${u.wins || 0}승 (${u.totalScore || 0}점)</span>`;
                    listEl.appendChild(li);
                });
            });
        }
        loadLeaderboard();

        // --- 2. 랜덤 매칭 로직 ---
        function startMatchmaking() {
            const nickInput = document.getElementById('nicknameInput').value.trim();
            if (!nickInput) {
                alert('닉네임을 입력해주세요!');
                return;
            }
            myNickname = nickInput;

            document.getElementById('lobby').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';

            const roomsRef = database.ref('rooms');
            
            roomsRef.once('value').then((snapshot) => {
                const rooms = snapshot.val() || {};
                let foundRoomId = null;

                for (let rId in rooms) {
                    if (rooms[rId].status === 'waiting' && rooms[rId].p1 && !rooms[rId].p2) {
                        foundRoomId = rId;
                        break;
                    }
                }

                if (foundRoomId) {
                    playerRole = 'p2';
                    roomId = foundRoomId;
                    roomRef = database.ref('rooms/' + roomId);

                    roomRef.update({
                        p2: { nickname: myNickname, score: 0 },
                        status: 'playing'
                    });
                } else {
                    playerRole = 'p1';
                    roomRef = roomsRef.push();
                    roomId = roomRef.key;

                    roomRef.set({
                        p1: { nickname: myNickname, score: 0 },
                        status: 'waiting'
                    });
                }

                roomRef.child(playerRole).onDisconnect().remove();
                startGame();
            });
        }

        const GRID_SIZE = 8;
        const TILE_SIZE = 50;
        const BOARD_OFFSET_X = 40;
        const BOARD_OFFSET_Y = 90;
        const COLORS = [0xff4d4d, 0x4d94ff, 0x4dff88, 0xffd633, 0xcc66ff];

        function startGame() {
            const config = {
                type: Phaser.AUTO,
                width: 480,
                height: 520,
                backgroundColor: '#2d2d2d',
                parent: 'game-container',
                scene: {
                    preload: preload,
                    create: create,
                    update: update
                }
            };
            new Phaser.Game(config);
        }

        function preload() {}

        function create() {
            gameScene = this;
            this.selectedTile = null;
            this.canMove = false;
            this.score = 0;
            this.opponentScore = 0;
            this.timeLeft = 30;
            this.isGameOver = false;
            this.isGameStarted = false;
            this.isQuizActive = false;

            this.add.text(BOARD_OFFSET_X, 10, `[나: ${myNickname}]`, { fontSize: '14px', color: '#4d94ff', fontStyle: 'bold' });
            this.timerText = this.add.text(BOARD_OFFSET_X + 220, 10, '⏱ 남은 시간: 30초', { fontSize: '15px', color: '#ffd633', fontStyle: 'bold' });

            this.myScoreText = this.add.text(BOARD_OFFSET_X, 35, '내 점수: 0', { fontSize: '18px', color: '#ffffff', fontStyle: 'bold' });
            this.opponentScoreText = this.add.text(BOARD_OFFSET_X + 220, 35, '상대 점수: 대기중', { fontSize: '18px', color: '#ff4d4d', fontStyle: 'bold' });

            COLORS.forEach((color, index) => {
                let g = this.add.graphics();
                g.fillStyle(color, 1);
                g.fillRoundedRect(0, 0, TILE_SIZE - 4, TILE_SIZE - 4, 10);
                g.generateTexture('tile_' + index, TILE_SIZE - 4, TILE_SIZE - 4);
                g.destroy();
            });

            this.board = [];
            for (let row = 0; row < GRID_SIZE; row++) {
                this.board[row] = [];
                for (let col = 0; col < GRID_SIZE; col++) {
                    let colorIndex = getValidColorIndex.call(this, row, col);
                    let tile = createTile.call(this, row, col, colorIndex);
                    this.board[row][col] = tile;
                }
            }

            this.waitingOverlay = this.add.graphics();
            this.waitingOverlay.fillStyle(0x000000, 0.85);
            this.waitingOverlay.fillRect(0, 0, 480, 520);
            this.waitingOverlay.setDepth(10);

            this.waitingText = this.add.text(240, 240, `🔍 매칭 상대 찾는 중...`, {
                fontSize: '22px', color: '#ffffff', align: 'center', fontStyle: 'bold'
            }).setOrigin(0.5).setDepth(11);

            roomRef.on('value', (snapshot) => {
                const data = snapshot.val() || {};

                let opponentRole = playerRole === 'p1' ? 'p2' : 'p1';
                if (data[opponentRole]) {
                    opponentNickname = data[opponentRole].nickname || "상대방";
                    if (data[opponentRole].score !== undefined) {
                        this.opponentScore = data[opponentRole].score;
                        this.opponentScoreText.setText(`${opponentNickname}: ${this.opponentScore}`);
                    }
                }

                if (data.status === 'playing' && !this.isGameStarted) {
                    this.isGameStarted = true;
                    this.canMove = true;

                    if (this.waitingOverlay) this.waitingOverlay.destroy();
                    if (this.waitingText) this.waitingText.destroy();

                    this.timeEvent = this.time.addEvent({
                        delay: 1000,
                        callback: onTimerTick,
                        callbackScope: this,
                        loop: true
                    });
                }
            });
        }

        function onTimerTick() {
            if (this.isGameOver || this.isQuizActive) return; // 퀴즈 푸는 중에는 타이머 멈춤

            this.timeLeft--;
            this.timerText.setText(`⏱️ 남은 시간: ${this.timeLeft}초`);

            if (this.timeLeft <= 0) {
                this.timeEvent.remove();
                showGameOverScreen.call(this);
            }
        }

        // --- 퀴즈 공격 모달 실행 ---
        function triggerQuizAttack() {
            gameScene.isQuizActive = true;
            gameScene.canMove = false;

            const modal = document.getElementById('quiz-modal');
            const qEl = document.getElementById('quiz-question');
            const optsEl = document.getElementById('quiz-options');

            const quiz = QUIZ_BANK[Math.floor(Math.random() * QUIZ_BANK.length)];

            qEl.innerText = quiz.q;
            optsEl.innerHTML = '';

            quiz.options.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option-btn';
                btn.innerText = `${idx + 1}. ${optText}`;
                btn.onclick = () => {
                    modal.style.display = 'none';
                    gameScene.isQuizActive = false;

                    if (idx === quiz.a) {
                        // 정답! 보상 및 상대방 공격
                        gameScene.score += 200;
                        gameScene.myScoreText.setText('내 점수: ' + gameScene.score);

                        // 상대방 점수 차감 요청 (최하 0점)
                        let opponentRole = playerRole === 'p1' ? 'p2' : 'p1';
                        roomRef.child(opponentRole + '/score').transaction((curr) => {
                            let newScore = (curr || 0) - 300;
                            return newScore < 0 ? 0 : newScore;
                        });

                        roomRef.child(playerRole).update({ score: gameScene.score });
                        showToast("🎯 정답! 상대방 점수 -300점 차감!");
                    } else {
                        showToast("❌ 오답! 공격 실패!");
                    }

                    if (!gameScene.isGameOver && gameScene.isGameStarted) gameScene.canMove = true;
                };
                optsEl.appendChild(btn);
            });

            modal.style.display = 'block';
        }

        function showToast(msg) {
            let toast = gameScene.add.text(240, 260, msg, {
                fontSize: '20px', color: '#ffd633', backgroundColor: '#000000', padding: { x: 15, y: 10 }
            }).setOrigin(0.5).setDepth(30);

            gameScene.tweens.add({
                targets: toast,
                y: 200,
                alpha: 0,
                duration: 1500,
                onComplete: () => toast.destroy()
            });
        }

        function showGameOverScreen() {
            this.isGameOver = true;
            this.canMove = false;

            document.getElementById('quiz-modal').style.display = 'none';

            let overlay = this.add.graphics();
            overlay.fillStyle(0x000000, 0.88);
            overlay.fillRect(0, 0, 480, 520);
            overlay.setDepth(20);

            let isWin = this.score > this.opponentScore;
            let resultMessage = isWin ? "🏆 승리했습니다! 🏆" : (this.score < this.opponentScore ? "📢 패배했습니다..." : "🤝 무승부입니다!");
            let resultColor = isWin ? "#4dff88" : (this.score < this.opponentScore ? "#ff4d4d" : "#ffd633");

            saveLeaderboardResult(myNickname, this.score, isWin);

            this.add.text(240, 150, '30초 대결 종료', { fontSize: '26px', color: '#aaaaaa' }).setOrigin(0.5).setDepth(21);
            this.add.text(240, 210, resultMessage, { fontSize: '32px', color: resultColor, fontStyle: 'bold' }).setOrigin(0.5).setDepth(21);
            this.add.text(240, 280, `내 점수 (${myNickname}): ${this.score}점`, { fontSize: '18px', color: '#ffffff' }).setOrigin(0.5).setDepth(21);
            this.add.text(240, 310, `상대 점수 (${opponentNickname}): ${this.opponentScore}점`, { fontSize: '18px', color: '#ffaaaa' }).setOrigin(0.5).setDepth(21);

            let restartBtn = this.add.text(240, 380, '🔄 다시 매칭하기', {
                fontSize: '20px', color: '#ffffff', backgroundColor: '#4d94ff', padding: { x: 20, y: 10 }
            }).setOrigin(0.5).setInteractive({ useHandCursor: true }).setDepth(21);

            restartBtn.on('pointerdown', () => {
                location.reload();
            });
        }

        function saveLeaderboardResult(nickname, finalScore, isWin) {
            const safeKey = nickname.replace(/[.#$\[\]/]/g, "_");
            const userRef = database.ref('leaderboard/' + safeKey);

            userRef.transaction((currentData) => {
                if (!currentData) {
                    return { nickname: nickname, wins: isWin ? 1 : 0, totalScore: finalScore, games: 1 };
                } else {
                    return {
                        nickname: nickname,
                        wins: (currentData.wins || 0) + (isWin ? 1 : 0),
                        totalScore: (currentData.totalScore || 0) + finalScore,
                        games: (currentData.games || 0) + 1
                    };
                }
            });
        }

        function getValidColorIndex(row, col) {
            let validColors = [];
            for (let i = 0; i < COLORS.length; i++) {
                let left1 = (col >= 1 && this.board[row][col - 1]) ? this.board[row][col - 1].colorIndex : -1;
                let left2 = (col >= 2 && this.board[row][col - 2]) ? this.board[row][col - 2].colorIndex : -1;
                let up1 = (row >= 1 && this.board[row - 1][col]) ? this.board[row - 1][col].colorIndex : -1;
                let up2 = (row >= 2 && this.board[row - 2][col]) ? this.board[row - 2][col].colorIndex : -1;
                let upLeft = (row >= 1 && col >= 1 && this.board[row - 1][col - 1]) ? this.board[row - 1][col - 1].colorIndex : -1;

                if (i === left1 && i === left2) continue;
                if (i === up1 && i === up2) continue;
                if (i === left1 && i === up1 && i === upLeft) continue;

                validColors.push(i);
            }
            return validColors[Phaser.Math.Between(0, validColors.length - 1)];
        }

        function createTile(row, col, colorIndex) {
            if (colorIndex === undefined) {
                colorIndex = Phaser.Math.Between(0, COLORS.length - 1);
            }
            let x = BOARD_OFFSET_X + col * TILE_SIZE + TILE_SIZE / 2;
            let y = BOARD_OFFSET_Y + row * TILE_SIZE + TILE_SIZE / 2;

            let tile = this.add.image(x, y, 'tile_' + colorIndex);
            tile.colorIndex = colorIndex;
            tile.row = row;
            tile.col = col;

            tile.setInteractive();
            tile.on('pointerdown', () => selectTile.call(this, tile));

            return tile;
        }

        function selectTile(tile) {
            if (!this.canMove || this.isGameOver || !this.isGameStarted || this.isQuizActive) return;

            if (!this.selectedTile) {
                this.selectedTile = tile;
                tile.setAlpha(0.5);
            } else {
                if (this.selectedTile === tile) {
                    this.selectedTile.setAlpha(1);
                    this.selectedTile = null;
                    return;
                }

                let isAdjacent = (Math.abs(this.selectedTile.row - tile.row) + Math.abs(this.selectedTile.col - tile.col)) === 1;

                if (isAdjacent) {
                    swapTiles.call(this, this.selectedTile, tile, true);
                } else {
                    this.selectedTile.setAlpha(1);
                    this.selectedTile = tile;
                    tile.setAlpha(0.5);
                }
            }
        }

        function swapTiles(tile1, tile2, checkMatchAfterSwap) {
            this.canMove = false;
            tile1.setAlpha(1);

            this.board[tile1.row][tile1.col] = tile2;
            this.board[tile2.row][tile2.col] = tile1;

            let tempRow = tile1.row;
            let tempCol = tile1.col;
            tile1.row = tile2.row;
            tile1.col = tile2.col;
            tile2.row = tempRow;
            tile2.col = tempCol;

            let x1 = BOARD_OFFSET_X + tile1.col * TILE_SIZE + TILE_SIZE / 2;
            let y1 = BOARD_OFFSET_Y + tile1.row * TILE_SIZE + TILE_SIZE / 2;
            let x2 = BOARD_OFFSET_X + tile2.col * TILE_SIZE + TILE_SIZE / 2;
            let y2 = BOARD_OFFSET_Y + tile2.row * TILE_SIZE + TILE_SIZE / 2;

            this.tweens.add({ targets: tile1, x: x1, y: y1, duration: 200 });
            this.tweens.add({
                targets: tile2,
                x: x2,
                y: y2,
                duration: 200,
                onComplete: () => {
                    this.selectedTile = null;

                    if (checkMatchAfterSwap) {
                        let matchResult = checkMatches.call(this);
                        if (matchResult.matches.length > 0) {
                            processMatches.call(this, matchResult);
                        } else {
                            swapTiles.call(this, tile1, tile2, false);
                        }
                    } else {
                        if (!this.isGameOver && this.isGameStarted && !this.isQuizActive) this.canMove = true;
                    }
                }
            });
        }

        function checkMatches() {
            let matchedTiles = new Set();
            let has2x2 = false;

            // 1. 일직선 3개 이상 체크
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE - 2; col++) {
                    let t1 = this.board[row][col];
                    let t2 = this.board[row][col + 1];
                    let t3 = this.board[row][col + 2];
                    if (t1 && t2 && t3 && t1.colorIndex === t2.colorIndex && t2.colorIndex === t3.colorIndex) {
                        matchedTiles.add(t1); matchedTiles.add(t2); matchedTiles.add(t3);
                    }
                }
            }

            for (let col = 0; col < GRID_SIZE; col++) {
                for (let row = 0; row < GRID_SIZE - 2; row++) {
                    let t1 = this.board[row][col];
                    let t2 = this.board[row + 1][col];
                    let t3 = this.board[row + 2][col];
                    if (t1 && t2 && t3 && t1.colorIndex === t2.colorIndex && t2.colorIndex === t3.colorIndex) {
                        matchedTiles.add(t1); matchedTiles.add(t2); matchedTiles.add(t3);
                    }
                }
            }

            // 2. 2x2 형태 체크 (퀴즈 공격 발동 조건)
            for (let row = 0; row < GRID_SIZE - 1; row++) {
                for (let col = 0; col < GRID_SIZE - 1; col++) {
                    let t1 = this.board[row][col];
                    let t2 = this.board[row][col + 1];
                    let t3 = this.board[row + 1][col];
                    let t4 = this.board[row + 1][col + 1];
                    if (t1 && t2 && t3 && t4 && t1.colorIndex === t2.colorIndex && t1.colorIndex === t3.colorIndex && t1.colorIndex === t4.colorIndex) {
                        matchedTiles.add(t1); matchedTiles.add(t2); matchedTiles.add(t3); matchedTiles.add(t4);
                        has2x2 = true;
                    }
                }
            }

            return { matches: Array.from(matchedTiles), has2x2: has2x2 };
        }

        function processMatches(matchResult) {
            let matches = matchResult.matches;
            this.score += matches.length * 100;
            this.myScoreText.setText('내 점수: ' + this.score);

            if (roomRef && playerRole) {
                roomRef.child(playerRole).update({ score: this.score });
            }

            // 2x2 매치 감지 시 퀴즈 공격 발동!
            if (matchResult.has2x2) {
                setTimeout(() => triggerQuizAttack(), 300);
            }

            this.tweens.add({
                targets: matches,
                scaleX: 0,
                scaleY: 0,
                alpha: 0,
                duration: 250,
                onComplete: () => {
                    matches.forEach(tile => {
                        this.board[tile.row][tile.col] = null;
                        tile.destroy();
                    });

                    dropAndRefill.call(this);
                }
            });
        }

        function dropAndRefill() {
            let dropTweens = [];

            for (let col = 0; col < GRID_SIZE; col++) {
                let emptySpaces = 0;

                for (let row = GRID_SIZE - 1; row >= 0; row--) {
                    if (this.board[row][col] === null) {
                        emptySpaces++;
                    } else if (emptySpaces > 0) {
                        let tile = this.board[row][col];
                        let targetRow = row + emptySpaces;

                        this.board[targetRow][col] = tile;
                        this.board[row][col] = null;
                        tile.row = targetRow;

                        let targetY = BOARD_OFFSET_Y + targetRow * TILE_SIZE + TILE_SIZE / 2;
                        dropTweens.push({ targets: tile, y: targetY, duration: 300 });
                    }
                }

                for (let i = 0; i < emptySpaces; i++) {
                    let targetRow = emptySpaces - 1 - i;
                    let tile = createTile.call(this, targetRow, col);

                    let targetY = BOARD_OFFSET_Y + targetRow * TILE_SIZE + TILE_SIZE / 2;
                    tile.y = BOARD_OFFSET_Y - (i + 1) * TILE_SIZE;

                    this.board[targetRow][col] = tile;
                    dropTweens.push({ targets: tile, y: targetY, duration: 300 });
                }
            }

            if (dropTweens.length > 0) {
                dropTweens.forEach((t, idx) => {
                    this.tweens.add({
                        ...t,
                        onComplete: idx === dropTweens.length - 1 ? () => {
                            let nextResult = checkMatches.call(this);
                            if (nextResult.matches.length > 0) {
                                processMatches.call(this, nextResult);
                            } else {
                                if (!this.isGameOver && this.isGameStarted && !this.isQuizActive) this.canMove = true;
                            }
                        } : null
                    });
                });
            } else {
                if (!this.isGameOver && this.isGameStarted && !this.isQuizActive) this.canMove = true;
            }
        }

        function update() {}
    </script>
